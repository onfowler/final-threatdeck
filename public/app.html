<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ThreatDeck App</title>
    
    <link rel="stylesheet" href="style.css">
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <script src="app.js" defer></script>
</head>
<body>
    <div class="dashboard-container">
        <div class="sidebar">
            <h2>My Watchlist</h2>
            <ul id="watchlist-ul">
                <li onclick="loadThreats('Recent Global Threats')">🌍 Global Feed</li>
            </ul>
            <form onsubmit="addSoftware(); return false;">
                <input type="text" id="softwareInput" placeholder="Add software (e.g. Ubuntu)" required>
                <button type="submit">Add</button>
            </form>
            <br>
            <a href="/">← Back Home</a>
        </div>

        <div class="main-content">
            <div id="chart-container">
                <canvas id="severityChart"></canvas>
            </div>
            <h2 id="current-target">Loading threats...</h2>
            <div id="threat-feed"></div>
        </div>
    </div>
</body>
</html>
